<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(주)트루데이타</title>
<meta name="description" content="(주)트루데이타 - 홈페이지 개편중입니다">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1A1A1A;
    --slate:#6B7280;
    --paper:#FAFAF9;
    --white:#FFFFFF;
    --orange:#F0932B;
    --orange-dim:#D97D1A;
    --line:rgba(26,26,26,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard', 'Space Grotesk', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100svh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .eng{font-family:'Space Grotesk', sans-serif;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vh 6vw;
    position:relative;
    overflow:hidden;
  }

  /* subtle background grid, evokes data / analytics without being loud */
  .grid-bg{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at center, black 0%, transparent 68%);
    mask-image:radial-gradient(ellipse at center, black 0%, transparent 68%);
    opacity:0.7;
  }

  .content{position:relative; z-index:2; max-width:600px;}

  .logo-slot{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:48px;
  }
  .logo-slot img{
    max-height:56px;
    width:auto;
  }

  h1{
    font-size:clamp(26px, 4vw, 36px);
    font-weight:700;
    line-height:1.5;
    letter-spacing:-0.2px;
    margin-bottom:18px;
    word-break:keep-all;
    color:var(--ink);
  }

  p.sub{
    font-size:15px;
    line-height:1.8;
    color:var(--slate);
    word-break:keep-all;
  }

  .divider{
    width:44px;
    height:3px;
    background:var(--orange);
    margin:32px auto;
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:28px 6vw 32px;
    font-size:12px;
    letter-spacing:1px;
    color:var(--slate);
    border-top:1px solid var(--line);
  }
</style>
</head>
